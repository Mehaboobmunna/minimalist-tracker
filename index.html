<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Time Tracker</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #101623;
      --surface-elevated: #151d2e;
      --surface-hover: #1b263b;
      --border: #202b40;
      --border-subtle: #172033;
      --border-focus: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #8b9bb4;
      --text-dim: #54647f;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --emerald-surface: rgba(16, 185, 129, 0.08);
      --amber: #f59e0b;
      --rose: #ef4444;
      --rose-surface: rgba(239, 68, 68, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    .app-shell {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .brand-icon svg {
      width: 15px;
      height: 15px;
      stroke: #fff;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grand-total-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .grand-total-badge strong {
      font-family: var(--font-mono);
      color: #60a5fa;
      font-weight: 600;
    }

    .btn-header {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .btn-header:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: #314263;
    }

    .btn-header.danger:hover {
      background: var(--rose-surface);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* PROJECT SELECTOR & TABS */
    .project-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .project-tabs-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .project-tabs-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .project-tabs-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .project-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.16s ease;
      user-select: none;
    }

    .project-pill:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .project-pill.active {
      background: var(--surface-elevated);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.15);
    }

    .project-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .project-pill-time {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      opacity: 0.75;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .project-pill.active .project-pill-time {
      opacity: 1;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.18);
    }

    .project-create-inline {
      display: flex;
      gap: 6px;
      min-width: 220px;
    }

    .project-create-input {
      background: var(--surface);
      border: 1px dashed var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      outline: none;
      width: 150px;
      transition: all 0.15s;
    }

    .project-create-input:focus {
      border-style: solid;
      border-color: var(--accent);
      width: 175px;
    }

    .btn-create-project {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-create-project:hover {
      background: #27364f;
    }

    /* HERO ACTIVE TIMER CARD */
    .hero-timer-card {
      position: relative;
      background: linear-gradient(180deg, #111827 0%, #0c121d 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .hero-timer-card.is-active {
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.1), 0 8px 30px rgba(0, 0, 0, 0.45);
    }

    .hero-timer-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.2s;
    }

    .hero-timer-card.is-active::before {
      background: linear-gradient(90deg, transparent, #10b981, #3b82f6, transparent);
    }

    .hero-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-project-context {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .hero-project-tag {
      font-weight: 600;
      color: #93c5fd;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-project-time {
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .hero-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 58%;
    }

    .hero-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .hero-status-tag.active {
      color: #34d399;
    }

    .pulsing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      display: inline-block;
    }

    .is-active .pulsing-dot {
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: hero-pulse 1.6s infinite ease-in-out;
    }

    @keyframes hero-pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .hero-task-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-task-title.idle {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 1.05rem;
      font-style: italic;
    }

    .hero-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hero-big-clock {
      font-family: var(--font-mono);
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    .is-active .hero-big-clock {
      color: #a7f3d0;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }

    .btn-hero-action {
      height: 42px;
      padding: 0 20px;
      border-radius: var(--radius-md);
      border: none;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.16s ease;
    }

    .btn-hero-action.btn-pause {
      background: #854d0e;
      color: #fef3c7;
      border: 1px solid #b45309;
    }

    .btn-hero-action.btn-pause:hover {
      background: #a16207;
    }

    .btn-hero-action.btn-resume {
      background: #047857;
      color: #ecfdf5;
      border: 1px solid #059669;
    }

    .btn-hero-action.btn-resume:hover {
      background: #059669;
    }

    .btn-hero-action:disabled {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* TASK CREATION BAR */
    .task-create-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.18s;
    }

    .task-create-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .task-create-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    .task-create-input::placeholder {
      color: var(--text-dim);
    }

    .shortcut-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 4px;
      user-select: none;
    }

    .btn-create-task {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn-create-task:hover {
      background: #2563eb;
    }

    /* TASK LIST */
    .task-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .task-header-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .task-count-badge {
      font-family: var(--font-mono);
      color: var(--text-dim);
      font-size: 0.78rem;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.15s ease;
      overflow: hidden;
    }

    .task-card:hover {
      background: var(--surface-hover);
      border-color: #2b3a54;
    }

    .task-card.is-running {
      border-color: rgba(16, 185, 129, 0.45);
      background: #0f1927;
      box-shadow: 0 2px 14px rgba(16, 185, 129, 0.08);
    }

    .task-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.04);
      width: 100%;
    }

    .task-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    .task-card.is-running .task-progress-fill {
      background: var(--emerald);
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .task-card.is-running .task-status-dot {
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .task-title-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: text;
    }

    .task-title-edit {
      background: var(--bg);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 0.92rem;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      outline: none;
      width: 100%;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .task-timer-text {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: #e2e8f0;
      min-width: 72px;
      text-align: right;
    }

    .task-card.is-running .task-timer-text {
      color: #6ee7b7;
      font-weight: 600;
    }

    .btn-task-toggle {
      border: none;
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn-task-toggle.play {
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
    }

    .btn-task-toggle.play:hover {
      background: #059669;
      color: #fff;
    }

    .btn-task-toggle.pause {
      background: #78350f;
      color: #fde68a;
      border: 1px solid #b45309;
    }

    .btn-task-toggle.pause:hover {
      background: #b45309;
      color: #fff;
    }

    .btn-icon-action {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 5px 7px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-icon-action:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .btn-icon-action.danger:hover {
      color: var(--rose);
      background: var(--rose-surface);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* EMPTY / ONBOARDING STATES */
    .onboarding-card {
      padding: 48px 24px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .onboarding-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .onboarding-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
    }

    .onboarding-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 380px;
      line-height: 1.5;
    }

    .onboarding-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      width: 100%;
      max-width: 340px;
    }

    .onboarding-input {
      flex: 1;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      outline: none;
    }

    .onboarding-input:focus {
      border-color: var(--accent);
    }

    /* FOOTER */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-dim);
      flex-wrap: wrap;
      gap: 12px;
    }

    .hotkey-hints {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hotkey-hint {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .kbd {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 5px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    /* TOAST */
    .toast-notice {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast-notice.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* CONFIRM MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
    }

    .modal-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-modal-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-modal-confirm {
      background: var(--rose);
      border: 1px solid var(--rose);
      color: #fff;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .hero-main-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .hero-task-info {
        max-width: 100%;
      }
      .hero-controls {
        width: 100%;
        justify-content: space-between;
      }
      .grand-total-badge {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-shell" id="app-root">
    <!-- Top Header -->
    <header>
      <div class="brand-group">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="brand-title">Minimalist Tracker</div>
      </div>

      <div class="header-actions">
        <div class="grand-total-badge">
          <span>Total</span>
          <strong id="header-grand-total">00:00:00</strong>
        </div>

        <button class="btn-header" id="btn-export-csv" title="Export timesheet as CSV">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export CSV
        </button>

        <button class="btn-header danger" id="btn-trigger-reset" title="Wipe all data and test from clean slate">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Reset to Zero
        </button>
      </div>
    </header>

    <!-- Main Content Dynamic Container -->
    <main id="main-content" style="display: flex; flex-direction: column; gap: 20px;">
      <!-- Populated via render() -->
    </main>

    <!-- Footer -->
    <footer>
      <div class="hotkey-hints">
        <div class="hotkey-hint"><span class="kbd">Space</span> Play / Pause active</div>
        <div class="hotkey-hint"><span class="kbd">N</span> or <span class="kbd">/</span> Focus task bar</div>
        <div class="hotkey-hint"><span class="kbd">Esc</span> Pause all</div>
      </div>
      <div>Zero-drift epoch timestamp tracking</div>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div class="toast-notice" id="toast-el">Saved</div>

  <!-- Confirmation Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">Reset to Zero?</div>
      <div class="modal-desc" id="modal-desc">This will permanently delete all projects, tasks, and accumulated timer records so you can test completely clean from scratch.</div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btn-modal-cancel">Cancel</button>
        <button class="btn-modal-confirm" id="btn-modal-confirm">Confirm Reset</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'minimalist_tracker_zero_v2';
      const PROJECT_COLORS = ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EC4899', '#06B6D4'];

      // --- 1. STATE INITIALIZATION (CLEAN ZERO SLATE BY DEFAULT) ---
      function getCleanState() {
        return {
          activeProjectId: null,
          projects: [],
          tasks: []
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const now = Date.now();
            // Reconcile background elapsed time if any task was running
            if (Array.isArray(parsed.tasks)) {
              parsed.tasks.forEach(t => {
                if (t.isRunning && t.startedAt) {
                  const elapsed = Math.floor((now - t.startedAt) / 1000);
                  t.accumulatedSeconds += Math.max(0, elapsed);
                  t.startedAt = now;
                }
              });
            }
            return parsed;
          }
        } catch (e) {
          console.error('Error loading state:', e);
        }
        return getCleanState();
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error('Failed to save to localStorage', e);
        }
      }

      // Reconcile time on window close/tab switch
      window.addEventListener('beforeunload', () => {
        const now = Date.now();
        state.tasks.forEach(t => {
          if (t.isRunning && t.startedAt) {
            t.accumulatedSeconds += Math.floor((now - t.startedAt) / 1000);
            t.startedAt = now;
          }
        });
        saveState();
      });

      // --- 2. TIME UTILITIES ---
      function pad(num) {
        return String(num).padStart(2, '0');
      }

      function formatTime(totalSec) {
        const sec = Math.max(0, Math.floor(totalSec || 0));
        const hrs = Math.floor(sec / 3600);
        const mins = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return `${pad(hrs)}:${pad(mins)}:${pad(s)}`;
      }

      function getTaskCurrentSeconds(task) {
        let secs = task.accumulatedSeconds || 0;
        if (task.isRunning && task.startedAt) {
          secs += Math.floor((Date.now() - task.startedAt) / 1000);
        }
        return Math.max(0, secs);
      }

      function getProjectTotalSeconds(projectId) {
        return state.tasks
          .filter(t => t.projectId === projectId)
          .reduce((sum, t) => sum + getTaskCurrentSeconds(t), 0);
      }

      function getGrandTotalSeconds() {
        return state.tasks.reduce((sum, t) => sum + getTaskCurrentSeconds(t), 0);
      }

      function getActiveRunningTask() {
        return state.tasks.find(t => t.isRunning) || null;
      }

      function getLatestTaskInProject(projectId) {
        const list = state.tasks.filter(t => t.projectId === projectId);
        return list[list.length - 1] || null;
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      }

      // --- 3. TOAST & MODAL NOTIFICATIONS ---
      function showToast(msg) {
        const toast = document.getElementById('toast-el');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      let pendingModalAction = null;
      function openModal(title, desc, confirmLabel, action) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-desc').textContent = desc;
        const confirmBtn = document.getElementById('btn-modal-confirm');
        confirmBtn.textContent = confirmLabel;
        pendingModalAction = action;
        document.getElementById('modal-backdrop').classList.add('open');
      }

      function closeModal() {
        document.getElementById('modal-backdrop').classList.remove('open');
        pendingModalAction = null;
      }

      document.getElementById('btn-modal-cancel').onclick = closeModal;
      document.getElementById('btn-modal-confirm').onclick = () => {
        if (pendingModalAction) pendingModalAction();
        closeModal();
      };

      // --- 4. CORE ACTIONS ---
      function createProject(name) {
        const trimmed = name.trim();
        if (!trimmed) return;
        const newId = 'proj-' + Date.now();
        const color = PROJECT_COLORS[state.projects.length % PROJECT_COLORS.length];
        state.projects.push({ id: newId, name: trimmed, color });
        state.activeProjectId = newId;
        saveState();
        render();
        showToast(`Project "${trimmed}" created`);
      }

      function deleteProject(projectId) {
        const proj = state.projects.find(p => p.id === projectId);
        if (!proj) return;

        openModal(
          `Delete Project "${proj.name}"?`,
          `This will permanently delete this project and all of its associated task timers.`,
          'Delete Project',
          () => {
            state.tasks = state.tasks.filter(t => t.projectId !== projectId);
            state.projects = state.projects.filter(p => p.id !== projectId);
            state.activeProjectId = state.projects.length > 0 ? state.projects[0].id : null;
            saveState();
            render();
            showToast('Project removed');
          }
        );
      }

      // Auto-start task creation engine
      function addTaskAndAutoStart(title) {
        const trimmed = title.trim();
        if (!trimmed || !state.activeProjectId) return;

        const now = Date.now();

        // Pause any other running task (single active timer policy)
        state.tasks.forEach(t => {
          if (t.isRunning) {
            t.accumulatedSeconds += Math.floor((now - t.startedAt) / 1000);
            t.isRunning = false;
            t.startedAt = null;
          }
        });

        // Insert new task in active running state
        const newTask = {
          id: 'task-' + Date.now(),
          projectId: state.activeProjectId,
          title: trimmed,
          accumulatedSeconds: 0,
          isRunning: true,
          startedAt: now
        };

        state.tasks.push(newTask);
        saveState();
        render();
        showToast('Task created & timer started!');
      }

      function toggleTask(taskId) {
        const now = Date.now();
        const target = state.tasks.find(t => t.id === taskId);
        if (!target) return;

        if (target.isRunning) {
          // Pause target
          target.accumulatedSeconds += Math.floor((now - target.startedAt) / 1000);
          target.isRunning = false;
          target.startedAt = null;
        } else {
          // Pause all others first
          state.tasks.forEach(t => {
            if (t.isRunning) {
              t.accumulatedSeconds += Math.floor((now - t.startedAt) / 1000);
              t.isRunning = false;
              t.startedAt = null;
            }
          });
          target.isRunning = true;
          target.startedAt = now;
          state.activeProjectId = target.projectId;
        }

        saveState();
        render();
      }

      function pauseAllTasks() {
        const now = Date.now();
        let changed = false;
        state.tasks.forEach(t => {
          if (t.isRunning) {
            t.accumulatedSeconds += Math.floor((now - t.startedAt) / 1000);
            t.isRunning = false;
            t.startedAt = null;
            changed = true;
          }
        });
        if (changed) {
          saveState();
          render();
          showToast('All timers paused');
        }
      }

      function deleteTask(taskId) {
        state.tasks = state.tasks.filter(t => t.id !== taskId);
        saveState();
        render();
        showToast('Task deleted');
      }

      function updateTaskTitle(taskId, newTitle) {
        const target = state.tasks.find(t => t.id === taskId);
        if (target && newTitle.trim()) {
          target.title = newTitle.trim();
          saveState();
          render();
        }
      }

      // --- 5. RENDER ENGINE ---
      function render() {
        const main = document.getElementById('main-content');
        main.innerHTML = '';

        // If zero projects exist, present clean onboarding state
        if (state.projects.length === 0) {
          renderCleanOnboarding(main);
          updateClocks();
          return;
        }

        // Active project guarantee
        if (!state.activeProjectId || !state.projects.some(p => p.id === state.activeProjectId)) {
          state.activeProjectId = state.projects[0].id;
        }

        renderProjectTabs(main);
        renderHeroBanner(main);
        renderTaskCreateBar(main);
        renderTaskList(main);
        updateClocks();
      }

      function renderCleanOnboarding(container) {
        const wrap = document.createElement('div');
        wrap.className = 'onboarding-card';
        wrap.innerHTML = `
          <div class="onboarding-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
          </div>
          <h2>Clean Slate: No Projects Found</h2>
          <p>Create your first project to begin tracking tasks. When you create any task, its timer will automatically start tracking immediately.</p>
          <form class="onboarding-form" id="onboarding-form">
            <input type="text" class="onboarding-input" id="onboarding-input" placeholder="e.g. Website Redesign" autofocus autocomplete="off" />
            <button type="submit" class="btn-create-task">+ Create Project</button>
          </form>
        `;
        container.appendChild(wrap);

        document.getElementById('onboarding-form').onsubmit = (e) => {
          e.preventDefault();
          const val = document.getElementById('onboarding-input').value;
          createProject(val);
        };
      }

      function renderProjectTabs(container) {
        const section = document.createElement('div');
        section.className = 'project-section';

        const tabsScroll = document.createElement('div');
        tabsScroll.className = 'project-tabs-scroll';

        state.projects.forEach(proj => {
          const pill = document.createElement('div');
          pill.className = `project-pill ${proj.id === state.activeProjectId ? 'active' : ''}`;
          pill.innerHTML = `
            <span class="project-dot" style="background-color: ${proj.color}"></span>
            <span>${escapeHtml(proj.name)}</span>
            <span class="project-pill-time" id="proj-badge-${proj.id}">00:00:00</span>
          `;
          pill.onclick = () => {
            state.activeProjectId = proj.id;
            saveState();
            render();
          };
          tabsScroll.appendChild(pill);
        });

        // Inline new project form
        const inlineForm = document.createElement('form');
        inlineForm.className = 'project-create-inline';
        inlineForm.innerHTML = `
          <input type="text" class="project-create-input" id="input-new-proj" placeholder="+ Add project..." autocomplete="off" />
          <button type="submit" class="btn-create-project">Add</button>
        `;
        inlineForm.onsubmit = (e) => {
          e.preventDefault();
          const inp = document.getElementById('input-new-proj');
          createProject(inp.value);
        };
        tabsScroll.appendChild(inlineForm);

        section.appendChild(tabsScroll);
        container.appendChild(section);
      }

      function renderHeroBanner(container) {
        const activeProj = state.projects.find(p => p.id === state.activeProjectId);
        const runningTask = getActiveRunningTask();
        const lastTask = getLatestTaskInProject(state.activeProjectId);

        const hero = document.createElement('div');
        hero.className = `hero-timer-card ${runningTask ? 'is-active' : ''}`;
        hero.id = 'hero-card';

        let statusText = 'Idle';
        let taskTitle = 'No tasks active in this project';
        let isIdle = true;
        let clockTime = '00:00:00';
        let actionBtnHtml = '';

        if (runningTask) {
          statusText = 'Recording Now';
          taskTitle = runningTask.title;
          isIdle = false;
          clockTime = formatTime(getTaskCurrentSeconds(runningTask));
          actionBtnHtml = `<button class="btn-hero-action btn-pause" id="btn-hero-toggle">Pause</button>`;
        } else if (lastTask) {
          statusText = 'Paused';
          taskTitle = lastTask.title;
          isIdle = false;
          clockTime = formatTime(getTaskCurrentSeconds(lastTask));
          actionBtnHtml = `<button class="btn-hero-action btn-resume" id="btn-hero-toggle">Resume</button>`;
        } else {
          actionBtnHtml = `<button class="btn-hero-action" id="btn-hero-toggle" disabled>Start</button>`;
        }

        hero.innerHTML = `
          <div class="hero-meta-row">
            <div class="hero-project-context">
              <span>Active Project:</span>
              <span class="hero-project-tag">
                <span class="project-dot" style="background-color: ${activeProj ? activeProj.color : '#3b82f6'}"></span>
                ${escapeHtml(activeProj ? activeProj.name : '')}
              </span>
              <span class="hero-project-time" id="hero-project-total">(00:00:00 total)</span>
            </div>
            <button class="btn-icon-action danger" id="btn-delete-active-project" title="Delete current project">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>

          <div class="hero-main-row">
            <div class="hero-task-info">
              <div class="hero-status-tag ${runningTask ? 'active' : ''}">
                <span class="pulsing-dot"></span>
                <span>${statusText}</span>
              </div>
              <div class="hero-task-title ${isIdle ? 'idle' : ''}">${escapeHtml(taskTitle)}</div>
            </div>

            <div class="hero-controls">
              <div class="hero-big-clock" id="hero-timer-display">${clockTime}</div>
              ${actionBtnHtml}
            </div>
          </div>
        `;

        container.appendChild(hero);

        // Attach hero events
        const heroToggle = document.getElementById('btn-hero-toggle');
        if (heroToggle && !heroToggle.disabled) {
          heroToggle.onclick = () => {
            if (runningTask) toggleTask(runningTask.id);
            else if (lastTask) toggleTask(lastTask.id);
          };
        }

        document.getElementById('btn-delete-active-project').onclick = () => {
          if (state.activeProjectId) deleteProject(state.activeProjectId);
        };
      }

      function renderTaskCreateBar(container) {
        const form = document.createElement('form');
        form.className = 'task-create-card';
        form.id = 'task-form';
        form.innerHTML = `
          <input
            type="text"
            class="task-create-input"
            id="task-create-input"
            placeholder="Add task to current project (auto-starts timer)..."
            autocomplete="off"
          />
          <span class="shortcut-badge">N or /</span>
          <button type="submit" class="btn-create-task">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            + Add & Start
          </button>
        `;

        form.onsubmit = (e) => {
          e.preventDefault();
          const inp = document.getElementById('task-create-input');
          addTaskAndAutoStart(inp.value);
        };

        container.appendChild(form);
      }

      function renderTaskList(container) {
        const projectTasks = state.tasks.filter(t => t.projectId === state.activeProjectId);

        const headerRow = document.createElement('div');
        headerRow.className = 'task-header-row';
        headerRow.innerHTML = `
          <span class="task-header-title">Project Tasks</span>
          <span class="task-count-badge">${projectTasks.length} ${projectTasks.length === 1 ? 'task' : 'tasks'}</span>
        `;
        container.appendChild(headerRow);

        const list = document.createElement('div');
        list.className = 'task-list';

        if (projectTasks.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'onboarding-card';
          empty.style.padding = '36px 16px';
          empty.innerHTML = `
            <p style="color: var(--text-dim); font-size: 0.85rem;">No tasks yet under this project. Add one above to begin timing.</p>
          `;
          list.appendChild(empty);
          container.appendChild(list);
          return;
        }

        const projectTotalSec = Math.max(1, getProjectTotalSeconds(state.activeProjectId));

        projectTasks.forEach(task => {
          const currentSec = getTaskCurrentSeconds(task);
          const percent = Math.min(100, Math.round((currentSec / projectTotalSec) * 100));

          const card = document.createElement('div');
          card.className = `task-card ${task.isRunning ? 'is-running' : ''}`;
          card.innerHTML = `
            <div class="task-progress-track">
              <div class="task-progress-fill" style="width: ${percent}%;"></div>
            </div>

            <div class="task-main">
              <span class="task-status-dot"></span>
              <div class="task-title-wrap" id="title-wrap-${task.id}">
                <span class="task-title" id="title-text-${task.id}" title="Double-click to rename">${escapeHtml(task.title)}</span>
              </div>
            </div>

            <div class="task-actions">
              <span class="task-timer-text" id="task-clock-${task.id}">${formatTime(currentSec)}</span>

              <button class="btn-task-toggle ${task.isRunning ? 'pause' : 'play'}" id="btn-toggle-${task.id}">
                ${task.isRunning ? 'Pause' : 'Start'}
              </button>

              <button class="btn-icon-action danger" id="btn-del-${task.id}" title="Delete task">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          `;

          list.appendChild(card);
        });

        container.appendChild(list);

        // Bind events after appending
        projectTasks.forEach(task => {
          const toggleBtn = document.getElementById(`btn-toggle-${task.id}`);
          if (toggleBtn) toggleBtn.onclick = () => toggleTask(task.id);

          const delBtn = document.getElementById(`btn-del-${task.id}`);
          if (delBtn) delBtn.onclick = () => deleteTask(task.id);

          const titleSpan = document.getElementById(`title-text-${task.id}`);
          if (titleSpan) {
            titleSpan.ondblclick = () => {
              const wrap = document.getElementById(`title-wrap-${task.id}`);
              wrap.innerHTML = `<input type="text" class="task-title-edit" id="input-edit-${task.id}" value="${escapeHtml(task.title)}" />`;
              const input = document.getElementById(`input-edit-${task.id}`);
              input.focus();
              input.select();

              const commit = () => {
                const val = input.value.trim();
                if (val && val !== task.title) updateTaskTitle(task.id, val);
                else render();
              };

              input.onblur = commit;
              input.onkeydown = (e) => {
                if (e.key === 'Enter') commit();
                if (e.key === 'Escape') render();
              };
            };
          }
        });
      }

      // --- 6. HIGH-PRECISION BACKGROUND HEARTBEAT TICK ---
      function updateClocks() {
        // Individual task timers
        state.tasks.forEach(t => {
          const clock = document.getElementById(`task-clock-${t.id}`);
          if (clock) clock.textContent = formatTime(getTaskCurrentSeconds(t));
        });

        // Project pill total counters
        state.projects.forEach(p => {
          const badge = document.getElementById(`proj-badge-${p.id}`);
          if (badge) badge.textContent = formatTime(getProjectTotalSeconds(p.id));
        });

        // Hero active clock
        const running = getActiveRunningTask();
        const heroClock = document.getElementById('hero-timer-display');
        if (running && heroClock) {
          heroClock.textContent = formatTime(getTaskCurrentSeconds(running));
        }

        // Hero project aggregate
        const heroProjTotal = document.getElementById('hero-project-total');
        if (heroProjTotal && state.activeProjectId) {
          heroProjTotal.textContent = `(${formatTime(getProjectTotalSeconds(state.activeProjectId))} total)`;
        }

        // Header Grand Total
        const headerGrand = document.getElementById('header-grand-total');
        if (headerGrand) {
          headerGrand.textContent = formatTime(getGrandTotalSeconds());
        }
      }

      // --- 7. EXPORT CSV & DATA RESET ---
      document.getElementById('btn-export-csv').onclick = () => {
        if (state.tasks.length === 0) {
          showToast('No tasks recorded to export');
          return;
        }

        const headers = ['Project Name', 'Task Title', 'Duration (HH:MM:SS)', 'Total Seconds', 'Status'];
        const rows = state.tasks.map(t => {
          const proj = state.projects.find(p => p.id === t.projectId);
          const totalSec = getTaskCurrentSeconds(t);
          return [
            `"${(proj ? proj.name : 'Unknown').replace(/"/g, '""')}"`,
            `"${t.title.replace(/"/g, '""')}"`,
            `"${formatTime(totalSec)}"`,
            totalSec,
            t.isRunning ? '"Running"' : '"Paused"'
          ];
        });

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `timesheet_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Timesheet exported as CSV');
      };

      document.getElementById('btn-trigger-reset').onclick = () => {
        openModal(
          'Wipe Data & Reset to Zero?',
          'All projects, recorded tasks, and active timers will be permanently cleared from this browser.',
          'Wipe Everything',
          () => {
            localStorage.removeItem(STORAGE_KEY);
            state = getCleanState();
            saveState();
            render();
            showToast('Reset completed. Clean slate ready.');
          }
        );
      };

      // --- 8. GLOBAL HOTKEYS ---
      window.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        const isTyping = activeTag === 'input' || activeTag === 'textarea';

        // 'N' or '/' to focus task creation bar
        if (!isTyping && (e.key === 'n' || e.key === 'N' || e.key === '/')) {
          e.preventDefault();
          const taskInput = document.getElementById('task-create-input');
          const onboardInput = document.getElementById('onboarding-input');
          if (taskInput) {
            taskInput.focus();
            taskInput.select();
          } else if (onboardInput) {
            onboardInput.focus();
          }
          return;
        }

        // 'Space' to play/pause active or last task
        if (!isTyping && e.code === 'Space') {
          e.preventDefault();
          const running = getActiveRunningTask();
          if (running) {
            toggleTask(running.id);
          } else {
            const last = getLatestTaskInProject(state.activeProjectId);
            if (last) toggleTask(last.id);
          }
          return;
        }

        // 'Escape' to pause running timer and blur inputs
        if (e.key === 'Escape') {
          pauseAllTasks();
          if (document.activeElement) document.activeElement.blur();
          closeModal();
        }
      });

      // --- 9. STARTUP ---
      render();
      setInterval(updateClocks, 1000);
    })();
  </script>
</body>
</html>
